name: CI

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build library and run host tests
        run: make test

  arm-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM GCC
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi
      - name: Compile core library for Cortex-M4 with C17
        run: |
          arm-none-eabi-gcc -std=c17 -Wall -Wextra -Wpedantic -Werror \
            -mcpu=cortex-m4 -mthumb -Os -Isrc -c src/tmc2209.c -o /dev/null
